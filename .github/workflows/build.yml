name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '17'
          cache: maven

      # No Azure credentials in CI: unit tests are deliberately offline, and the
      # integration steps in the README are run by hand against a real account.
      - name: Verify
        run: ./mvnw -B clean verify

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco
          path: '**/target/site/jacoco/'
          if-no-files-found: ignore
